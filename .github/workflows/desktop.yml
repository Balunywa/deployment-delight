name: Desktop app

# Builds the Windows installers (x64 and ARM64; per-user setup .exe and .msi) for the Cloud Delivery desktop app,
# with a build provenance attestation (verify with: gh attestation verify <file> --repo <owner>/<repo>).
#
#   Tag vX.Y.Z  → a release vX.Y.Z with both architectures' installers.
#   Run manually → installers as workflow artifacts (version 0.1.<run number>), for testing.
#
# Both architectures build on the x64 Windows runner; ARM64 is cross-compiled, so this works in private repos too.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install, check and build the app
        run: |
          bun install --frozen-lockfile
          npx tsc --noEmit -p .
          npx vite build

      - name: Stage the bundled runtime
        run: node scripts/stage-desktop.mjs --arch ${{ matrix.arch }}

      - name: Set the version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.1.${{ github.run_number }}' }
          @{ version = $version } | ConvertTo-Json | Set-Content src-tauri/tauri.version.json
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build the installers
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles nsis,msi --config src-tauri/tauri.version.json

      - name: Collect
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$bundle/nsis/*.exe" "out/CloudDelivery-$env:VERSION-${{ matrix.arch }}-setup.exe"
          Copy-Item "$bundle/msi/*.msi" "out/CloudDelivery-$env:VERSION-${{ matrix.arch }}.msi"
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Tee-Object out/SHA256-${{ matrix.arch }}.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/*.exe
            out/*.msi

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-delivery-${{ matrix.arch }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat out/SHA256-*.txt > out/SHA256SUMS.txt && rm out/SHA256-*.txt
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Cloud Delivery $TAG" --verify-tag \
            --notes "Windows installers for x64 and ARM64, built from $GITHUB_SHA with a build provenance attestation. Install the -setup.exe for your PC (no admin rights needed); see docs/INSTALL-DESKTOP.md."
