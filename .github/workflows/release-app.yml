name: Release Cloud Delivery app (web, retired)

# RETIRED: the Azure-hosted console is no longer run; Cloud Delivery ships as the desktop app (desktop.yml), and
# version tags publish the desktop installers. This builds the web package only when run by hand (artifact only),
# for anyone who self-hosts it with deploy/azure.
#
# Builds a self-contained, prebuilt package of the Cloud Delivery console with a build provenance attestation
# (verify with: gh attestation verify cloud-delivery-app.zip --repo <owner>/<repo>).

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install, check and build
        run: |
          bun install --frozen-lockfile
          npx tsc --noEmit -p .
          npx vite build

      - name: Stage package
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cloud-delivery-app"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R .output "$STAGE/.output"
          # SQL migrations + demo seed; the server applies them on first use when AUTO_MIGRATE=true.
          cp -R db "$STAGE/db"
          cat > "$STAGE/package.json" <<'JSON'
          {
            "name": "cloud-delivery-app",
            "private": true,
            "type": "module",
            "engines": { "node": ">=22" },
            "scripts": { "start": "node .output/server/index.mjs" }
          }
          JSON

      - name: Zip package (contents at archive root)
        run: |
          set -euo pipefail
          ( cd "$RUNNER_TEMP/cloud-delivery-app" && zip -qr "$GITHUB_WORKSPACE/cloud-delivery-app.zip" . )
          sha256sum cloud-delivery-app.zip | tee cloud-delivery-app.zip.sha256

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: cloud-delivery-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            cloud-delivery-app.zip
            cloud-delivery-app.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" cloud-delivery-app.zip cloud-delivery-app.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Cloud Delivery $TAG" --verify-tag \
            --notes "Built once from $GITHUB_SHA with a build provenance attestation. SHA-256: $(cut -d' ' -f1 cloud-delivery-app.zip.sha256)"

  edge:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Update the app-latest edge build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Cloud Delivery app (edge build from main)
          prerelease: true
          make_latest: false
          body: |
            Edge build of the Cloud Delivery console from main, for the demo Deploy to Azure button.
            It changes on every push. For production, pin a vX.Y.Z release instead.
            Commit: ${{ github.sha }}
          files: |
            cloud-delivery-app.zip
            cloud-delivery-app.zip.sha256
